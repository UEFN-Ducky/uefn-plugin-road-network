<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>City Builder</title>
  <script src="../../_kit/ducky.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { overflow: hidden; font-family: var(--font-ui); display: flex; flex-direction: column; }
    .dk-layout { flex: 1; min-height: 0; }

    /* ---------- header: the open world and what to do with it */
    .rn-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--header); }
    .rn-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--fg); margin-right: 8px; white-space: nowrap; }
    .rn-brand .rn-icon { color: var(--accent); }
    .rn-world { min-width: 200px; max-width: 320px; }
    .rn-world .dk-field__label, .rn-world label { display: none; }
    .rn-header .rn-spacer { flex: 1; }
    .rn-header .dk-btn { display: inline-flex; align-items: center; gap: 6px; }

    /* ---------- left sidebar: sections, layers, actors, version; resizable */
    .rn-left { width: var(--left-w, 248px); position: relative; }
    .rn-grip { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: col-resize; z-index: 3; }
    .rn-grip:hover, .rn-grip.is-dragging { background: linear-gradient(to right, transparent 3px, var(--accent) 3px, var(--accent) 5px, transparent 5px); }
    .rn-version { padding: 8px 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
    .rn-layer { display: flex; align-items: center; gap: 8px; cursor: grab; }
    .rn-layer.is-dragging { opacity: 0.5; }
    .rn-layer.is-over { box-shadow: inset 0 2px 0 var(--accent); }
    .rn-layer .rn-dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
    .rn-layer .rn-num { width: 18px; flex: none; text-align: right; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .rn-layer .rn-grab { color: var(--muted); opacity: 0; transition: opacity 120ms ease; flex: none; }
    .rn-layer:hover .rn-grab { opacity: 1; }
    .rn-order-hint { font-size: 11px; color: var(--muted); margin: -4px 4px 6px; }
    .rn-layer.is-off { color: var(--muted); }

    /* ---------- bottom tool bar: point, draw, tell an AI */
    /* the map tool bar: the Workflows canvas bar (icon buttons, a zoom readout), same variables */
    .rn-tools { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 2px;
                padding: 4px; border-radius: 10px; background: var(--wf-panel); backdrop-filter: blur(var(--wf-panel-blur));
                -webkit-backdrop-filter: blur(var(--wf-panel-blur)); border: 1px solid var(--border); box-shadow: var(--shadow-md); }
    .rn-tool { position: relative; display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; background: transparent;
               color: var(--fg-dim); border-radius: 8px; cursor: pointer; transition: background-color 120ms ease, color 120ms ease; }
    .rn-tool:hover { color: var(--fg); background: var(--bg-hover); }
    .rn-tool[aria-pressed="true"] { color: var(--fg); background: var(--btn-pressed); box-shadow: inset 0 0 0 1px var(--border-light); }
    .rn-tool:focus-visible, .rn-zoom:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 1px; }
    .rn-tools .rn-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
    .rn-zoom { min-width: 44px; height: 32px; border: 0; background: transparent; color: var(--fg-dim); font: inherit; font-size: 12px;
               font-variant-numeric: tabular-nums; border-radius: 8px; cursor: pointer; padding: 0 6px; }
    .rn-zoom:hover { color: var(--fg); background: var(--bg-hover); }
    #view.is-hand canvas { cursor: grab; }
    #view.is-hand canvas:active { cursor: grabbing; }
    .rn-help { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 5; width: 280px; padding: 10px 12px;
               background: var(--wf-panel); backdrop-filter: blur(var(--wf-panel-blur)); -webkit-backdrop-filter: blur(var(--wf-panel-blur));
               border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); font-size: 12px; animation: rn-pop 160ms ease; }
    .rn-help[hidden] { display: none; }
    .rn-help__title { font-weight: 600; color: var(--fg); margin-bottom: 6px; }
    .rn-help__row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; color: var(--fg-dim); }
    .rn-help__keys { color: var(--fg); font-family: var(--font-mono); font-size: 11px; }
    .rn-note { position: absolute; left: 50%; bottom: 68px; transform: translateX(-50%); z-index: 4; width: min(420px, calc(100% - 32px));
               background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 12px;
               display: flex; flex-direction: column; gap: 8px; }
    .rn-note[hidden] { display: none; }
    .rn-note textarea { width: 100%; min-height: 72px; resize: vertical; box-sizing: border-box; font: inherit; font-size: 13px;
                        background: var(--input-bg); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px; }
    .rn-note textarea:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 1px; }
    .rn-note__row { display: flex; gap: 8px; align-items: center; }
    .rn-note__row > :first-child { flex: 1; min-width: 0; }
    .rn-note__where { font-size: 12px; color: var(--fg-dim); }
    .rn-brief { background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; }
    #view.is-drawing canvas { cursor: crosshair; }
    .dk-main.rn-main { position: relative; min-width: 0; padding: 0; overflow: hidden; }
    #view { position: absolute; inset: 0; }
    #view canvas { display: block; width: 100%; height: 100%; outline: none; }

    /* ---------- side panels */
    .rn-left { width: 236px; display: flex; flex-direction: column; overflow: hidden; }
    .rn-left .rn-scroll { flex: 1; overflow: auto; padding: 0 4px 8px; }
    .rn-right { width: 328px; display: flex; flex-direction: column; overflow: hidden; padding: 0; }
    .rn-section { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--fg-dim); margin: 16px 4px 8px; }
    .rn-group:first-child .rn-section { margin-top: 4px; }
    .rn-list { display: flex; flex-direction: column; gap: 2px; }
    .rn-list .dk-nav-item { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .rn-list .dk-nav-item > span:first-of-type { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
    .rn-count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .rn-tag { font-size: 10px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--border); color: var(--fg-dim); }
    .rn-pull { display: flex; gap: 4px; padding: 0 4px; }
    .rn-pull .dk-input { flex: 1; min-width: 0; }

    /* ---------- tabs + panes */
    .rn-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 12px 12px 8px; }
    .rn-tabs .dk-tab { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; font-size: 12px; }
    .rn-pane { flex: 1; overflow: auto; padding: 4px 12px 16px; display: none; }
    .rn-pane.is-open { display: block; }
    .rn-foot { border-top: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .rn-foot[hidden] { display: none; }
    .rn-foot .dk-btn--primary { width: 100%; justify-content: center; }
    .rn-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .rn-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .rn-btns .rn-btn, .rn-stack .rn-btn { width: 100%; }
    .rn-stack { display: flex; flex-direction: column; gap: 8px; }
    .rn-hint { font-size: 12px; color: var(--muted); line-height: 1.45; }
    .rn-icon { flex: none; }

    /* ---------- fields */
    .rn-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .rn-field__label { font-size: 12px; color: var(--fg-dim); }
    .rn-input-row { display: flex; gap: 4px; }
    .rn-input-row .dk-input { flex: 1; min-width: 0; }

    /* ---------- slider */
    .rn-slider { margin-bottom: 14px; border-radius: var(--radius-sm); outline: none; touch-action: none; }
    .rn-slider:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 4px; }
    .rn-slider__head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; margin-bottom: 8px; }
    .rn-slider__label { color: var(--fg-dim); }
    .rn-slider__val { color: var(--fg); font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 11px;
                      background: var(--input-bg); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
    .rn-slider__track { position: relative; height: 6px; border-radius: 999px; background: var(--input-bg); border: 1px solid var(--border); cursor: pointer; }
    .rn-slider__track::before { content: ""; position: absolute; inset: -8px 0; }
    .rn-slider__fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--accent); }
    .rn-slider__thumb { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--fg);
                        border: 2px solid var(--accent); transform: translate(-50%, -50%); box-shadow: var(--shadow-sm);
                        transition: transform 140ms ease; }
    .rn-slider:hover .rn-slider__thumb, .rn-slider.is-dragging .rn-slider__thumb { transform: translate(-50%, -50%) scale(1.15); }

    /* ---------- segmented pills */
    .rn-seg { display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--input-bg); border: 1px solid var(--border); }
    .rn-seg__btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; border: 0;
                   background: transparent; color: var(--fg-dim); border-radius: 999px; padding: 5px 8px; font: inherit; font-size: 12px;
                   cursor: pointer; transition: background-color 140ms ease, color 140ms ease; white-space: nowrap; }
    .rn-seg__btn span { overflow: hidden; text-overflow: ellipsis; }
    .rn-seg__btn:hover { color: var(--fg); background: var(--bg-hover); }
    .rn-seg__btn[aria-checked="true"] { background: var(--accent); color: var(--fg-inverse); }
    .rn-seg__btn:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 1px; }

    /* ---------- switch + chips */
    .rn-switch { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; color: var(--fg);
                 font: inherit; font-size: 12px; padding: 6px 4px; border-radius: var(--radius-sm); cursor: pointer; margin-bottom: 8px; }
    .rn-switch:hover { background: var(--bg-hover); }
    .rn-switch:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 1px; }
    .rn-switch__label { flex: 1; text-align: left; }
    .rn-switch__track { width: 30px; height: 18px; border-radius: 999px; background: var(--input-bg); border: 1px solid var(--border);
                        position: relative; transition: background-color 160ms ease; flex: none; }
    .rn-switch__knob { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--fg-dim);
                       transition: transform 160ms ease, background-color 160ms ease; }
    .rn-switch[aria-checked="true"] .rn-switch__track { background: var(--accent); border-color: var(--accent); }
    .rn-switch[aria-checked="true"] .rn-switch__knob { transform: translateX(12px); background: var(--fg-inverse); }
    .rn-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--bg-panel);
               color: var(--fg-dim); border-radius: 999px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer;
               transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease; }
    .rn-chip:hover { color: var(--fg); background: var(--bg-hover); }
    .rn-chip[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); }
    .rn-chip[aria-pressed="true"] .rn-icon { color: var(--accent); }
    .rn-chip:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }

    /* ---------- choice rows */
    .rn-choices { display: flex; flex-direction: column; gap: 4px; }
    .rn-choice { width: 100%; text-align: left; display: flex; align-items: center; gap: 10px; }
    .rn-choice .dk-choice__text { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .rn-choice__check { opacity: 0; color: var(--accent); transition: opacity 140ms ease; }
    .rn-choice[aria-checked="true"] .rn-choice__check { opacity: 1; }
    .rn-choice:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 1px; }

    /* ---------- cards */
    .rn-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 8px; }
    .rn-card__head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; color: var(--fg); }
    .rn-card__head .rn-card__name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .rn-kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 12px; }
    .rn-kv span:nth-child(odd) { color: var(--fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rn-kv span:nth-child(even) { font-variant-numeric: tabular-nums; text-align: right; }
    .rn-stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .rn-stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px; }
    .rn-stat b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; color: var(--fg); }
    .rn-stat span { font-size: 11px; color: var(--muted); }
    .rn-xyz { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .rn-xyz .dk-input { width: 100%; min-width: 0; font-family: var(--font-mono); font-size: 11px; }
    .rn-steps { counter-reset: step; display: flex; flex-direction: column; gap: 8px; }
    .rn-step { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; }
    .rn-step::before { counter-increment: step; content: counter(step); width: 22px; height: 22px; border-radius: 50%;
                       display: grid; place-items: center; font-size: 11px; background: var(--input-bg); border: 1px solid var(--border); color: var(--fg-dim); }
    .rn-code { font-family: var(--font-mono); font-size: 11px; background: var(--input-bg); border: 1px solid var(--border);
               border-radius: var(--radius-sm); padding: 8px; word-break: break-all; color: var(--fg); }

    /* ---------- viewport chrome */
    .rn-toolbar { position: absolute; left: 12px; top: 12px; right: 12px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; pointer-events: none; }
    .rn-toolbar > * { pointer-events: auto; }
    .rn-toolbar .rn-sep { width: 1px; background: var(--border); margin: 4px 2px; }
    .rn-hud { position: absolute; right: 12px; top: 12px; z-index: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
              pointer-events: none; text-align: right; }
    .rn-hud b { font-size: 15px; color: var(--fg); }
    .rn-hud span { font-size: 11px; color: var(--fg-dim); }
    .rn-labels { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .rn-label { position: absolute; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 4px; white-space: nowrap;
                font-size: 11px; color: var(--fg); background: var(--bg-panel); border: 1px solid var(--border); border-radius: 999px;
                padding: 2px 8px; box-shadow: var(--shadow-sm); }
    .rn-label .rn-icon { color: var(--accent); }
    .rn-busy { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); z-index: 5; pointer-events: none; }
    /* ---------- loading card: what is happening, and how far along */
    .rn-load { width: min(360px, calc(100vw - 48px)); background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius);
               box-shadow: var(--shadow-lg); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; animation: rn-pop 180ms ease; }
    .rn-load__title { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; font-weight: 600; color: var(--fg); }
    .rn-load__pct { font-weight: 400; color: var(--fg-dim); font-variant-numeric: tabular-nums; font-size: 12px; }
    .rn-load__step { font-size: 12px; color: var(--fg-dim); min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rn-load__bar { position: relative; height: 4px; border-radius: 999px; background: var(--input-bg); overflow: hidden; }
    .rn-load__fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--accent); transition: width 350ms ease; }
    .rn-load__fill.is-indet { width: 35%; animation: rn-indet 1.1s ease-in-out infinite; }
    @keyframes rn-indet { from { left: -35%; } to { left: 100%; } }
    @keyframes rn-pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .rn-load, .rn-load__fill.is-indet { animation: none; } }
    /* ---------- left: the world's cities (outliner) */
    .rn-section-row { display: flex; align-items: center; justify-content: space-between; margin: 16px 4px 8px; }
    .rn-section-row .rn-section { margin: 0; }
    .rn-mini { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); background: var(--bg-panel); color: var(--fg-dim);
               border-radius: 999px; padding: 2px 8px; font: inherit; font-size: 11px; cursor: pointer; }
    .rn-mini:hover { color: var(--fg); background: var(--bg-hover); }
    .rn-mini:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 1px; }
    .rn-city { border-radius: var(--radius-sm); }
    .rn-city__row { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; color: var(--fg); font: inherit;
                    font-size: 13px; padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer; text-align: left; }
    .rn-city__row:hover { background: var(--bg-hover); }
    .rn-city__row:focus-visible { outline: 2px solid var(--border-focus); outline-offset: -2px; }
    .rn-city.is-open > .rn-city__row { background: var(--bg-hover); box-shadow: inset 2px 0 0 var(--accent); }
    .rn-city__name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rn-city__pop { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .rn-city__del { opacity: 0; border: 0; background: transparent; color: var(--muted); padding: 2px; border-radius: 4px; cursor: pointer; display: inline-flex; }
    .rn-city:hover .rn-city__del, .rn-city__del:focus-visible { opacity: 1; }
    .rn-city__del:hover { color: var(--red); }
    .rn-city__kids { display: flex; flex-direction: column; gap: 1px; padding: 2px 0 6px 26px; }
    .rn-city__kid { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-dim); padding: 3px 6px; border-radius: 4px; }
    .rn-city__kid b { font-weight: 400; color: var(--fg); margin-left: auto; font-variant-numeric: tabular-nums; }
    .rn-banner { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 8px;
                 background: var(--bg-panel); border: 1px solid var(--accent); border-radius: 999px; padding: 6px 8px 6px 14px; font-size: 12px;
                 color: var(--fg); box-shadow: var(--shadow-md); }
    .rn-banner[hidden] { display: none; }
    .rn-empty-view { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; pointer-events: none; }
    #err:empty { display: none; }
    #err { padding: 0 12px; }
  </style>
</head>
<body data-live-view="networks:world">
  <header class="rn-header" aria-label="City Builder">
    <div class="rn-brand" id="brand"></div>
    <div class="rn-world" id="worldPick"><div class="dk-loading">Loading worlds…</div></div>
    <div id="headActions" class="dk-row"></div>
    <div class="rn-spacer"></div>
    <div id="headPush" class="dk-row"></div>
  </header>
  <div class="dk-layout">
    <aside class="dk-sidebar rn-left" aria-label="Sections and layers">
      <div class="rn-scroll">
        <div class="rn-section">Sections</div>
        <div class="rn-list" id="nav" role="tablist" aria-orientation="vertical"></div>
        <!-- what the left side shows follows the section: the world's cities, the layer order, or the road actors -->
        <div id="leftCities" class="rn-left-block">
          <div class="rn-section-row"><span class="rn-section">Cities</span><span id="cityAdd"></span></div>
          <div class="rn-list rn-cities" id="cityList"><div class="rn-hint">Open a world.</div></div>
        </div>
        <div id="leftLayers" class="rn-left-block" hidden>
          <div class="rn-section">Layer order</div>
          <div class="rn-list" id="layerList"><div class="rn-hint">Open a world.</div></div>
        </div>
        <div id="leftActors" class="rn-left-block" hidden>
          <div class="rn-section">Road actors</div>
          <div class="rn-list" id="actors"><div class="rn-hint">Open a world.</div></div>
          <div class="rn-section">Pull from UEFN</div>
          <div class="rn-pull" id="pullRow"></div>
        </div>
        <div id="nets" hidden></div>
      </div>
      <div class="rn-version" id="version"></div>
      <div class="rn-grip" id="leftGrip" role="separator" aria-orientation="vertical" aria-label="Resize the sidebar" tabindex="0"></div>
    </aside>
    <main class="dk-main rn-main">
      <div id="view" tabindex="0" aria-label="3D road network view"></div>
      <div class="rn-labels" id="labels"></div>
      <div class="rn-toolbar" id="toolbar"></div>
      <div class="rn-hud" id="hud"></div>
      <div class="rn-busy" id="busy"></div>
      <div class="rn-banner" id="banner" hidden></div>
      <div class="rn-empty-view" id="emptyView"></div>
      <div class="rn-tools" id="tools" role="toolbar" aria-label="Map tools"></div>
      <div class="rn-note" id="note" hidden></div>
    </main>
    <aside class="dk-sidebar dk-sidebar--right rn-right" aria-label="Section settings">
      <div class="dk-sidebar__title" id="paneTitle">World</div>
      <div id="tabs" hidden></div>
